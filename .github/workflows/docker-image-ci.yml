name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - working-directory: ./jpws-service/jpws-service/vagrant/jpws/python
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag jpws:$(date +%s)
